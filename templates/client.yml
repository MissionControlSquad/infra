# Template: per-client Docker Compose override
# Placeholders: __SLUG__, __AUTH_SECRET__, __CRON_SECRET__, __IMAGE__,
#               __LICENSE_REFRESH_TOKEN__, __WORKSPACE_ID__
# Shared env vars come from infra/.env

volumes:
  app_data___SLUG__:

services:
  app-__SLUG__:
    image: __IMAGE__
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - POSTGRES_PRISMA_URL=postgresql://postgres:${PG_PASS}@postgres:5432/client___SLUG__?connection_limit=3&pool_timeout=10
      - POSTGRES_URL_NON_POOLING=postgresql://postgres:${PG_PASS}@postgres:5432/client___SLUG__?connection_limit=1
      - AUTH_SECRET=__AUTH_SECRET__
      - CRON_SECRET=__CRON_SECRET__
      - REDIS_URL=redis://redis:6379
      - NEXT_PUBLIC_MC_URL=https://__SLUG__.app.agentcenter.cloud
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_PREFIX=clients/__SLUG__
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - NOTIFICATION_FROM_EMAIL=${NOTIFICATION_FROM_EMAIL}
      - LICENSE_SERVER_URL=http://dashboard:4000
      - LICENSE_REFRESH_TOKEN=__LICENSE_REFRESH_TOKEN__
      # ── buildbase (SaaSOS) platform binding ──────────────────────────
      # Same platform values for every tenant (from infra/.env). These wire the
      # tenant container to the shared buildbase server for human auth / SSO.
      - NEXT_PUBLIC_SAAS_SERVER_URL=${SAAS_SERVER_URL}
      - SAAS_SERVER_URL=${SAAS_SERVER_URL}
      - NEXT_PUBLIC_SAAS_ORG_ID=${SAAS_ORG_ID}
      - SAAS_ORG_ID=${SAAS_ORG_ID}
      - NEXT_PUBLIC_SAAS_CLIENT_ID=${SAAS_CLIENT_ID}
      - SAAS_CLIENT_ID=${SAAS_CLIENT_ID}
      - SAAS_CLIENT_SECRET=${SAAS_CLIENT_SECRET}
      # Public URL of THIS tenant (used by the buildbase auth callback + SSO).
      - NEXT_PUBLIC_APP_URL=https://__SLUG__.app.agentcenter.cloud
      # Shared parent-domain cookie enables cross-subdomain SSO (monorepo bridge).
      - AUTH_COOKIE_DOMAIN=${AUTH_COOKIE_DOMAIN:-.agentcenter.cloud}
      # Per-tenant buildbase workspace this container is bound to. The monorepo
      # bridge enforces membership of this workspace. Empty ⇒ single-tenant fallback
      # (no cross-tenant gate) until re-bound via `ac bind-workspace __SLUG__`.
      - TENANT_WORKSPACE_ID=__WORKSPACE_ID__
    volumes:
      - app_data___SLUG__:/app/data
    # Disable Dockerfile healthcheck — Traefik routes as soon as the container starts
    healthcheck:
      disable: true
    networks: [agentcenter]
    deploy:
      resources:
        limits:
          memory: 300M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.__SLUG__.rule=Host(`__SLUG__.app.agentcenter.cloud`)
      - traefik.http.routers.__SLUG__.entrypoints=websecure
      - traefik.http.routers.__SLUG__.tls.certresolver=letsencrypt
      - traefik.http.services.__SLUG__.loadbalancer.server.port=3000
      # END_LABELS
