# Template: per-client Docker Compose override
# Placeholders: __SLUG__, __AUTH_SECRET__, __CRON_SECRET__, __IMAGE__, __LICENSE_REFRESH_TOKEN__
# Shared env vars come from infra/.env

volumes:
  app_data___SLUG__:

services:
  app-__SLUG__:
    image: __IMAGE__
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - POSTGRES_PRISMA_URL=postgresql://postgres:${PG_PASS}@postgres:5432/client___SLUG__
      - POSTGRES_URL_NON_POOLING=postgresql://postgres:${PG_PASS}@postgres:5432/client___SLUG__
      - AUTH_SECRET=__AUTH_SECRET__
      - CRON_SECRET=__CRON_SECRET__
      - REDIS_URL=redis://redis:6379
      - NEXT_PUBLIC_MC_URL=https://__SLUG__.app.agentcenter.cloud
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_PREFIX=clients/__SLUG__
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - NOTIFICATION_FROM_EMAIL=${NOTIFICATION_FROM_EMAIL}
      - LICENSE_SERVER_URL=http://dashboard:4000
      - LICENSE_REFRESH_TOKEN=__LICENSE_REFRESH_TOKEN__
      - LICENSE_PUBLIC_KEY=__LICENSE_PUBLIC_KEY__
    labels:
      - traefik.enable=true
      - traefik.http.routers.__SLUG__.rule=Host(`__SLUG__.app.agentcenter.cloud`)
      - traefik.http.routers.__SLUG__.entrypoints=websecure
      - traefik.http.routers.__SLUG__.tls.certresolver=letsencrypt
      - traefik.http.services.__SLUG__.loadbalancer.server.port=3000
    volumes:
      - app_data___SLUG__:/app/data
    # Disable Dockerfile healthcheck — Traefik routes as soon as the container starts
    healthcheck:
      disable: true
    networks: [agentcenter]
    deploy:
      resources:
        limits:
          memory: 300M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
