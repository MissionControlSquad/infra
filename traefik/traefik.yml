# Traefik static configuration
api:
  dashboard: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: agentcenter

certificatesResolvers:
  letsencrypt:
    acme:
      email: "admin@agentcenter.cloud"
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web
