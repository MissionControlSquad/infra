name: Deploy to VM

# The hosted service has been shut down, so this no longer runs on every push
# to main. It is kept for anyone operating their own copy of this stack and
# runs only when started by hand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to build, push and deploy the dashboard'
        required: true
        type: string

permissions: {}

concurrency:
  group: deploy-vm
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    if: inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set image name
        id: image
        run: |
          echo "name=${OWNER,,}/agentcenter-dashboard" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Set up QEMU (for multi-platform builds)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dashboard image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./dashboard
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ vars.SSH_IP }} >> ~/.ssh/known_hosts

      - name: Write .env to VM
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ vars.SSH_USERNAME }}@${{ vars.SSH_IP }} "cat > /opt/agentcenter/.env" << EOF
          PG_PASS=${{ secrets.PG_PASS }}
          ACME_EMAIL=${{ vars.ACME_EMAIL }}
          R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME=${{ vars.R2_BUCKET_NAME }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          GHCR_TOKEN=${{ secrets.GHCR_TOKEN }}
          GHCR_USER=${{ vars.GHCR_USER }}
          GHCR_OWNER=${{ vars.GHCR_OWNER }}
          VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT=${{ secrets.VAPID_SUBJECT }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_FROM_EMAIL=${{ secrets.NOTIFICATION_FROM_EMAIL }}
          API_KEY=${{ secrets.API_KEY }}
          EOF

      - name: Sync infra files to VM
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.env' \
            --exclude '.env.example' \
            --exclude 'clients/' \
            --exclude 'dashboard/' \
            --exclude 'node_modules/' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            ./ ${{ vars.SSH_USERNAME }}@${{ vars.SSH_IP }}:/opt/agentcenter/

      - name: Pull and restart dashboard on VM
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ vars.SSH_USERNAME }}@${{ vars.SSH_IP }} << 'EOF'
            cd /opt/agentcenter
            source .env
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull ghcr.io/${{ steps.image.outputs.name }}:latest
            docker compose up -d dashboard
          EOF
